# The README and the documentation print what they show: the build script writes each
# of their Rust blocks as a function, and the test compares what each prints with the
# output under it. A package of its own, which is not published, and which has the
# other crates of the family that some blocks use.
[package]
name = "oxirush-nas-readme"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# The features of the crate that blocks of its documentation test for, which the blocks
# here always have.
[features]
default = ["security", "tree"]
security = []
tree = []

[dev-dependencies]
oxirush-nas = { path = "..", features = ["security", "tree"] }
oxirush-security = "0.4"
oxirush-ngap = { version = "0.5", features = ["inspect"] }
oxirush-s1ap = { version = "0.3", features = ["inspect"] }
hex = "0.4.3"

# Not a member of a workspace that the crate may be in.
[workspace]
