# The Rust programs of compare.sh: oxirush-nas, and packet-dissector at the
# versions that this manifest pins, on the same messages. A package of its
# own, which is not published: the crate depends on none of these.
[package]
name = "oxirush-nas-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-nas = { path = "../.." }
packet-dissector-core = "=0.6.1"
packet-dissector-nas5g = "=0.6.1"
packet-dissector-nas-eps = "=0.6.1"
hex = "0.4"

# Not a member of a workspace that the crate may be in.
[workspace]

# oxirush-security 0.5.0 and oxirush-utils 0.3.0, until their releases.
[patch.crates-io]
oxirush-security = { git = "https://github.com/linouxis9/oxirush-security", rev = "c7b5888dfcbb101eb569031f401d9cc02696db3d" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "5d22965aee97b66f962dcc72d7fbbd2d682c0a7f" }
