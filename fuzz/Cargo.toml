[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxirush-nas]
path = ".."
features = ["security"]

# Prevent this from interfering with workspace
[workspace]
members = ["."]

[[bin]]
name = "fuzz_decode_nas_5gs"
path = "fuzz_targets/fuzz_decode_nas_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_nas_eps"
path = "fuzz_targets/fuzz_decode_nas_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip_nas_5gs"
path = "fuzz_targets/fuzz_roundtrip_nas_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip_nas_eps"
path = "fuzz_targets/fuzz_roundtrip_nas_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip_struct_nas_5gs"
path = "fuzz_targets/fuzz_roundtrip_struct_nas_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip_struct_nas_eps"
path = "fuzz_targets/fuzz_roundtrip_struct_nas_eps.rs"
test = false
doc = false
bench = false
