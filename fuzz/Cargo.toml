[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# Without the `security` feature, so that the targets build from a clone
# whatever version of oxirush-security crates.io has.
[dependencies.oxirush-nas]
path = ".."
features = ["serde"]

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_5gs"
path = "fuzz_targets/decode_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eps"
path = "fuzz_targets/decode_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_5gs"
path = "fuzz_targets/view_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_eps"
path = "fuzz_targets/view_eps.rs"
test = false
doc = false
bench = false
