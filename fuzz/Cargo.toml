[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.oxirush-nas]
path = ".."
features = ["tree", "security"]

# The codes and the ciphering that the targets of the security contexts
# compare a context with: the version that the crate takes.
[dependencies.oxirush-security]
version = "0.4.0"
default-features = false
features = ["alloc"]

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_5gs"
path = "fuzz_targets/decode_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eps"
path = "fuzz_targets/decode_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_5gs"
path = "fuzz_targets/tree_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_eps"
path = "fuzz_targets/tree_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_5gs"
path = "fuzz_targets/edit_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_eps"
path = "fuzz_targets/edit_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_5gs"
path = "fuzz_targets/build_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_eps"
path = "fuzz_targets/build_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "security_5gs"
path = "fuzz_targets/security_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "security_eps"
path = "fuzz_targets/security_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths_5gs"
path = "fuzz_targets/paths_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths_eps"
path = "fuzz_targets/paths_eps.rs"
test = false
doc = false
bench = false

# tree::Takes of oxirush-utils, and its trees that hold the names of the crate without
# copying them, are not released yet: every crate of the build takes oxirush-utils from
# this revision until its next release.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "4eae6c700f102dbf134e47f758e96799bee3f537" }
