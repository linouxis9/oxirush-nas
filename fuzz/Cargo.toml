[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.oxirush-nas]
path = ".."
features = ["tree", "security"]

# The codes and the ciphering that the targets of the security contexts
# compare a context with: the version that the crate takes.
[dependencies.oxirush-security]
version = "0.4.0"
default-features = false
features = ["alloc"]

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_5gs"
path = "fuzz_targets/decode_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eps"
path = "fuzz_targets/decode_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_5gs"
path = "fuzz_targets/tree_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_eps"
path = "fuzz_targets/tree_eps.rs"
test = false
doc = false
bench = false

