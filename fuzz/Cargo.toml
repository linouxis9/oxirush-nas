[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# Without the `security` feature: the targets do not build oxirush-security.
[dependencies.oxirush-nas]
path = ".."
features = ["serde"]

# Not part of any parent workspace.
[workspace]
members = ["."]

# oxirush-security 0.3.0 is not on crates.io yet, and Cargo resolves it for
# the lockfile of this package, because the `std` feature of the crate names
# it: until it is published, it comes from its repository.
[patch.crates-io]
oxirush-security = { git = "https://github.com/linouxis9/oxirush-security" }

[[bin]]
name = "decode_5gs"
path = "fuzz_targets/decode_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eps"
path = "fuzz_targets/decode_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_5gs"
path = "fuzz_targets/view_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_eps"
path = "fuzz_targets/view_eps.rs"
test = false
doc = false
bench = false
