[package]
name = "oxirush-nas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# Without the `security` feature: the targets do not build oxirush-security.
[dependencies.oxirush-nas]
path = ".."
features = ["serde"]

# Not part of any parent workspace.
[workspace]
members = ["."]

# oxirush-security 0.3.0 and oxirush-utils 0.1.0 are not on crates.io yet, and
# Cargo resolves oxirush-security for the lockfile of this package, because the
# `std` feature of the crate names it: until they are published, they come from
# their repositories, oxirush-utils at a revision.
[patch.crates-io]
oxirush-security = { git = "https://github.com/linouxis9/oxirush-security" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "0617bcb831fec1e9a7a41f7c370a4f624868073e" }

[[bin]]
name = "decode_5gs"
path = "fuzz_targets/decode_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_eps"
path = "fuzz_targets/decode_eps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_5gs"
path = "fuzz_targets/view_5gs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_eps"
path = "fuzz_targets/view_eps.rs"
test = false
doc = false
bench = false
