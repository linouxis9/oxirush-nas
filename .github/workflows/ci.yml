name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # oxirush-security 0.3.0 is not on crates.io yet: take it from its repository.
  SECURITY: --config patch.crates-io.oxirush-security.git="https://github.com/linouxis9/oxirush-security"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $SECURITY --all-features
      - run: cargo test $SECURITY

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $SECURITY --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $SECURITY --all-targets --all-features -- -D warnings
      - run: cargo clippy $SECURITY --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc $SECURITY --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # The inputs of the benchmarks are messages that the codec gives back.
      - run: cargo test --manifest-path benches/Cargo.toml
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - run: cargo clippy $SECURITY --manifest-path benches/Cargo.toml --all-targets --features security -- -D warnings

  fuzz:
    name: Fuzz the decoders and the JSON forms (4 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Each corpus starts from the messages of tests/fixtures.
      - run: ./fuzz/seed.sh
      - run: cargo fuzz run decode_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run decode_eps -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_eps -- -max_total_time=60 -max_len=512

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
