name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # oxirush-security 0.3.0 is not on crates.io yet: take it from its repository.
  SECURITY: --config patch.crates-io.oxirush-security.git="https://github.com/linouxis9/oxirush-security"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $SECURITY --all-features
      - run: cargo test $SECURITY
      # Without `std`: the codec alone, then with the two other features
      - run: cargo test $SECURITY --no-default-features
      - run: cargo test $SECURITY --no-default-features --features serde,security

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build $SECURITY --target ${{ matrix.target }} --no-default-features
      - run: cargo build $SECURITY --target ${{ matrix.target }} --no-default-features --features security
      - run: cargo build $SECURITY --target ${{ matrix.target }} --no-default-features --features serde
      - run: cargo build $SECURITY --target ${{ matrix.target }} --no-default-features --features serde,security

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $SECURITY --all-features
      - run: cargo test $SECURITY --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $SECURITY --all-targets --all-features -- -D warnings
      - run: cargo clippy $SECURITY --all-targets -- -D warnings
      - run: cargo clippy $SECURITY --all-targets --no-default-features -- -D warnings
      - run: cargo clippy $SECURITY --all-targets --no-default-features --features serde,security -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc $SECURITY --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc $SECURITY --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # The package takes oxirush-security from its repository by a patch of
      # its own manifest, so its commands need no `--config`.
      # The inputs of the benchmarks are messages that the codec gives back.
      - run: cargo test --manifest-path benches/Cargo.toml
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets --features security -- -D warnings

  fuzz:
    name: Fuzz the decoders and the JSON forms (4 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Each corpus starts from the messages of tests/fixtures.
      - run: ./fuzz/seed.sh
      - run: cargo fuzz run decode_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run decode_eps -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_eps -- -max_total_time=60 -max_len=512

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
