name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer run of a branch, or of a pull request, cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test
      # Without `std`: the codec alone, then with security
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features security
      # In the optimized build: no copy of a key is left in the memory of the
      # process once its security contexts are dropped
      - run: cargo test --release --features security --test key_wiping

  # 32 bits, where a `usize` holds less than a `u64` and a `Vec` is 12 octets.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --target i686-unknown-linux-musl

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features security
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features idna

  # The lowest version of each dependency that Cargo.toml allows: the tests
  # of each set of features on the host, and the builds for a target without
  # the standard library
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test --locked --all-features
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features security
      - run: cargo test --locked --no-default-features --features tree
      - run: cargo test --locked --no-default-features --features tree,security
      - run: cargo test --locked --no-default-features --features idna
      - name: Build without std
        run: |
          cargo build --locked --target thumbv7em-none-eabihf --no-default-features
          cargo build --locked --target thumbv7em-none-eabihf --no-default-features --features security
          cargo build --locked --target thumbv7em-none-eabihf --no-default-features --features idna

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features security -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # The inputs of the benchmarks are messages that the codec gives back.
      - run: cargo test --manifest-path benches/Cargo.toml
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets --features security -- -D warnings

  fuzz:
    name: Fuzz each target (10 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The dictionaries are those that the tables of the crate give.
      - run: ./fuzz/dict.sh && git diff --exit-code fuzz/nas-5gs.dict fuzz/nas-eps.dict
      # Each corpus of a target that reads octets starts from the messages of
      # tests/fixtures; the other targets start from the fixtures themselves.
      - run: ./fuzz/seed.sh
      - run: cargo fuzz run decode_5gs -- -max_total_time=60 -max_len=512 -dict=fuzz/nas-5gs.dict
      - run: cargo fuzz run decode_eps -- -max_total_time=60 -max_len=512 -dict=fuzz/nas-eps.dict
      - run: cargo fuzz run tree_5gs -- -max_total_time=60 -max_len=512 -dict=fuzz/nas-5gs.dict
      - run: cargo fuzz run tree_eps -- -max_total_time=60 -max_len=512 -dict=fuzz/nas-eps.dict
      - run: cargo fuzz run edit_5gs -- -max_total_time=60 -max_len=512 -len_control=0
      - run: cargo fuzz run edit_eps -- -max_total_time=60 -max_len=512 -len_control=0
      - run: cargo fuzz run build_5gs -- -max_total_time=60 -max_len=512 -len_control=0
      - run: cargo fuzz run build_eps -- -max_total_time=60 -max_len=512 -len_control=0
      - run: cargo fuzz run security_5gs -- -max_total_time=60 -max_len=1024 -len_control=0
      - run: cargo fuzz run security_eps -- -max_total_time=60 -max_len=1024 -len_control=0

  # The targets beside those of the codec, in a job of their own: the paths of a
  # message, a minute each.
  fuzz-more:
    name: Fuzz the paths (2 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run paths_5gs -- -max_total_time=60 -max_len=512 -len_control=0
      - run: cargo fuzz run paths_eps -- -max_total_time=60 -max_len=512 -len_control=0

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  # The README and the documentation print what they show: readme/ is a package of its
  # own, with the other crates of the family that some blocks use at the versions of its
  # manifest, so that the crate depends on none of them.
  readme:
    name: The README blocks print what the README shows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: readme
      - run: cargo test --manifest-path readme/Cargo.toml
      - run: cargo clippy --manifest-path readme/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path readme/Cargo.toml
