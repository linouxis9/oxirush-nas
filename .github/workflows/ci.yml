name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # oxirush-security 0.3.0 and oxirush-utils 0.1.0 are not on crates.io yet:
  # take them from their repositories at a revision.
  UNPUBLISHED: >-
    --config patch.crates-io.oxirush-security.git="https://github.com/linouxis9/oxirush-security"
    --config patch.crates-io.oxirush-security.rev="ef44694160068baa68870b86536705b5bc18b634"
    --config patch.crates-io.oxirush-utils.git="https://github.com/linouxis9/oxirush-utils"
    --config patch.crates-io.oxirush-utils.rev="0617bcb831fec1e9a7a41f7c370a4f624868073e"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $UNPUBLISHED --all-features
      - run: cargo test $UNPUBLISHED
      # Without `std`: the codec alone, then with the two other features
      - run: cargo test $UNPUBLISHED --no-default-features
      - run: cargo test $UNPUBLISHED --no-default-features --features serde,security
      # In the optimized build: no copy of a key is left in the memory of the
      # process once its security contexts are dropped
      - run: cargo test $UNPUBLISHED --release --features security --test key_wiping

  # 32 bits, where a `usize` holds less than a `u64` and a `Vec` is 12 octets.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $UNPUBLISHED --all-features --target i686-unknown-linux-musl

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build $UNPUBLISHED --target ${{ matrix.target }} --no-default-features
      - run: cargo build $UNPUBLISHED --target ${{ matrix.target }} --no-default-features --features security
      - run: cargo build $UNPUBLISHED --target ${{ matrix.target }} --no-default-features --features serde
      - run: cargo build $UNPUBLISHED --target ${{ matrix.target }} --no-default-features --features serde,security
      - run: cargo build $UNPUBLISHED --target ${{ matrix.target }} --no-default-features --features idna

  # The lowest version of each dependency that Cargo.toml allows: the tests
  # of each set of features on the host, and the builds for a target without
  # the standard library
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo update $UNPUBLISHED -Z direct-minimal-versions
      - run: cargo test $UNPUBLISHED --locked --all-features
      - run: cargo test $UNPUBLISHED --locked
      - run: cargo test $UNPUBLISHED --locked --no-default-features
      - run: cargo test $UNPUBLISHED --locked --no-default-features --features security
      - run: cargo test $UNPUBLISHED --locked --no-default-features --features serde
      - run: cargo test $UNPUBLISHED --locked --no-default-features --features serde,security
      - run: cargo test $UNPUBLISHED --locked --no-default-features --features idna
      - name: Build without std
        run: |
          cargo build $UNPUBLISHED --locked --target thumbv7em-none-eabihf --no-default-features
          cargo build $UNPUBLISHED --locked --target thumbv7em-none-eabihf --no-default-features --features security
          cargo build $UNPUBLISHED --locked --target thumbv7em-none-eabihf --no-default-features --features serde
          cargo build $UNPUBLISHED --locked --target thumbv7em-none-eabihf --no-default-features --features serde,security
          cargo build $UNPUBLISHED --locked --target thumbv7em-none-eabihf --no-default-features --features idna

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $UNPUBLISHED --all-features
      - run: cargo test $UNPUBLISHED --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $UNPUBLISHED --all-targets --all-features -- -D warnings
      - run: cargo clippy $UNPUBLISHED --all-targets -- -D warnings
      - run: cargo clippy $UNPUBLISHED --all-targets --no-default-features -- -D warnings
      - run: cargo clippy $UNPUBLISHED --all-targets --no-default-features --features serde,security -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc $UNPUBLISHED --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc $UNPUBLISHED --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # The package takes oxirush-security from its repository by a patch of
      # its own manifest, so its commands need no `--config`.
      # The inputs of the benchmarks are messages that the codec gives back.
      - run: cargo test --manifest-path benches/Cargo.toml
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets --features security -- -D warnings

  fuzz:
    name: Fuzz the decoders and the JSON forms (4 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Each corpus starts from the messages of tests/fixtures.
      - run: ./fuzz/seed.sh
      - run: cargo fuzz run decode_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run decode_eps -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_5gs -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run view_eps -- -max_total_time=60 -max_len=512

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
