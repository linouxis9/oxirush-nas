name: Mutants

# The mutation testing of the crate: the jobs of crate-mutants.yml of oxirush-aper,
# which every crate of the family calls, here with 72 shards, two at a time, and the
# mutants of the stack wiping. The workflow is run by hand before a release: with
# `full`, every mutant; without it, the mutants of the code that the commits since the
# last run changed, and none without such a commit; with `recheck`, the mutants that a
# file of the repository names, as a missed.txt has them, again at the head.
# .cargo/mutants.toml says what it leaves alone, and why.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the changes since the last run
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than two
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  mutants:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-mutants.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      shards: 72
      changes-shards: 2
      full: ${{ inputs.full }}
      parallel: ${{ inputs.parallel || '2' }}
      recheck: ${{ inputs.recheck }}

  # The functions that wipe what a key derivation leaves on the stack, which
  # .cargo/mutants.toml leaves out: only tests/key_wiping.rs, which reads the memory
  # of its process in an optimized build, sees what they do.
  key-wiping:
    name: Mutants of the stack wiping (release)
    # Every mutant, as the shards, beside them
    if: inputs.full && inputs.recheck == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: >-
          cargo mutants --no-config -j 2 --profile release --features security
          -f src/common/security.rs -F 'ClearStack|clear_stack'
          -- --test key_wiping
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-key-wiping
          path: mutants.out
