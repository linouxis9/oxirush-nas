name: Fuzz

# The fuzz targets of fuzz/, longer than the minute that each has at a push: the jobs of
# crate-fuzz.yml of oxirush-aper, which every crate of the family calls. An hour for
# each target every day but Tuesday and Sunday, from 11:03 UTC, one target at a time,
# and four hours for each on Tuesday, four at a time, less when the fuzzing of a run
# would not end within the eight hours that crate-fuzz.yml gives it; the crates of the
# family fuzz each at an hour of its own, with few jobs at once, and each has a day of
# its own for its long run, so that what they run at once leaves runners to the other CI
# (GitHub starts a scheduled run hours after its time, in their order). The corpus of
# each target is kept from one run to the next in the cache of the repository, and
# grows. On Tuesday, and when `weekly` is set by hand, each corpus is minimized and its
# coverage kept for 30 days. A crash or a timeout fails the job, which keeps the input
# and the log: the input goes into the tests with its fix.
on:
  schedule:
    - cron: "3 11 * * 1,3-6"
    - cron: "3 11 * * 2"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Tuesday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

# A dispatch gives its minutes as text, which fromJSON makes the number that the called
# workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
jobs:
  fuzz:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-fuzz.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      weekly: "3 11 * * 2"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      weekly-parallel: 4
      # The seeds: each message of tests/fixtures and of fuzz/seeds-*.tsv.
      setup: ./fuzz/seed.sh
      coverage-ignore: '/\.cargo/registry/|/rustc/|/fuzz/fuzz_targets/'
      # The targets that read octets take the dictionary of their system: the header of
      # each message type, and each IE of the tables. Those that build their input with
      # `arbitrary` try inputs of any length from the start.
      targets: >-
        [{"target": "decode_5gs", "max_len": 512, "flags": "-dict=fuzz/nas-5gs.dict"},
         {"target": "decode_eps", "max_len": 512, "flags": "-dict=fuzz/nas-eps.dict"},
         {"target": "tree_5gs", "max_len": 512, "flags": "-dict=fuzz/nas-5gs.dict"},
         {"target": "tree_eps", "max_len": 512, "flags": "-dict=fuzz/nas-eps.dict"},
         {"target": "edit_5gs", "max_len": 512, "flags": "-len_control=0"},
         {"target": "edit_eps", "max_len": 512, "flags": "-len_control=0"},
         {"target": "build_5gs", "max_len": 512, "flags": "-len_control=0"},
         {"target": "build_eps", "max_len": 512, "flags": "-len_control=0"},
         {"target": "security_5gs", "max_len": 1024, "flags": "-len_control=0"},
         {"target": "security_eps", "max_len": 1024, "flags": "-len_control=0"},
         {"target": "paths_5gs", "max_len": 512, "flags": "-len_control=0"},
         {"target": "paths_eps", "max_len": 512, "flags": "-len_control=0"}]
