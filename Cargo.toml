[package]
name = "oxirush-nas"
version = "0.6.0"
edition = "2024"
description = "5G (5GS) and 4G LTE (EPS) NAS messages in Rust (3GPP TS 24.501 and TS 24.301, Release 19): decode, build, validate and encode every message, edit it as JSON, and protect it with NAS security. no_std."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-nas"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["nas", "5g", "lte", "eps", "3gpp"]
categories = ["network-programming", "encoding", "parser-implementations", "no-std"]
readme = "README.md"
exclude = ["/.cargo", "/.github", "/.gitignore", "/benches", "/readme", "/fuzz", "/RELEASING.md"]

[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs an
# allocator: the codec, `validate()`, the builders, `Display` and the JSON
# forms are the same. With it, oxirush-security chooses the vector code of
# SNOW 3G and ZUC from what the processor has.
std = ["oxirush-security?/std"]
# NAS security contexts: `protect` and `unprotect`. It is `no_std` too.
security = ["dep:oxirush-security"]
# The realm and the username of the NAI of a SUCI are also checked as
# internationalized names: Unicode normalization form C, and a realm that
# IDNA takes. Without it they are checked by the grammar of RFC 7542 alone.
# It is the feature `idna` of oxirush-utils, which brings the Unicode tables
# of `idna` and of `unicode-normalization`, some forty crates, and is
# `no_std` too.
idna = ["oxirush-utils/idna"]
# A message as JSON: its tree and the paths of its values, which are those of
# the feature `tree` of oxirush-utils, and `Serialize` and `Deserialize`
# through the tree. It takes the standard library.
tree = ["std", "oxirush-utils/tree"]

[dependencies]
pastey = "0.2"
# The identities of the OxiRush crates: PLMN, digits, GUTI, TAI, SUPI, SUCI
oxirush-utils = { version = "0.2.2", default-features = false, features = ["alloc"] }

# Optional: NAS security envelope (integrity + ciphering). `alloc` for
# `build_s`, which returns a `Vec`.
oxirush-security = { version = "0.4.0", default-features = false, features = ["alloc"], optional = true }


[dev-dependencies]
serde_json = "1.0.154"
hex = "0.4.3"
zeroize = "1.9"

# A program of its own, which reads the memory of its processes. It holds
# only in an optimized build, which `cargo test` does not make: run it with
# `cargo test --release --features security --test key_wiping`.
[[test]]
name = "key_wiping"
harness = false
test = false
required-features = ["security"]

[[example]]
name = "security_nas_5gs"
required-features = ["security"]

[[example]]
name = "security_nas_eps"
required-features = ["security"]

[[example]]
name = "tree_message_nas_5gs"
required-features = ["tree"]

[[example]]
name = "tree_message_nas_eps"
required-features = ["tree"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
