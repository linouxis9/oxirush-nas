[package]
name = "oxirush-nas"
version = "0.5.0"
edition = "2024"
description = "5GS and EPS NAS message encoder/decoder per 3GPP TS 24.501 and TS 24.301"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-nas"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "4g", "nas", "3gpp", "codec"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"
exclude = ["/.github", "/benches", "/fuzz"]

[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs an
# allocator: the codec, `validate()`, the builders and `Display` are the
# same. With it, oxirush-security chooses the vector code of SNOW 3G and ZUC
# from what the processor has, and the `serde` feature has the JSON forms.
std = [
    "thiserror/std",
    "hex/std",
    "oxirush-security?/std",
]
# NAS security contexts: `protect` and `unprotect`. It is `no_std` too.
security = ["dep:oxirush-security"]
# The realm and the username of the NAI of a SUCI are also checked as
# internationalized names: Unicode normalization form C, and a realm that
# IDNA takes. Without it they are checked by the grammar of RFC 7542 alone.
# It is the feature `idna` of oxirush-utils, which brings the Unicode tables
# of `idna` and of `unicode-normalization`, some forty crates, and is
# `no_std` too.
idna = ["oxirush-utils/idna"]
# The JSON forms of a message: its tree, its view and their paths, which are
# those of the feature `tree` of oxirush-utils, and `Serialize` and
# `Deserialize` through the trees, by its feature `serde`. It needs `std`, for
# the names that the forms print and the state of each thread.
serde = ["std", "oxirush-utils/serde"]

[dependencies]
thiserror = { version = "2.0.1", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
pastey = "0.2"
# The identities of the OxiRush crates: PLMN, digits, GUTI, TAI, SUPI, SUCI
oxirush-utils = { version = "0.1.0", default-features = false, features = ["alloc"] }

# Optional: NAS security envelope (integrity + ciphering). `alloc` for
# `build_s`, which returns a `Vec`.
oxirush-security = { version = "0.3.0", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1.0.154"
base64 = "0.22.1"

# A program of its own, which reads the memory of its processes
[[test]]
name = "key_wiping"
harness = false
required-features = ["security"]

[[example]]
name = "security_nas_5gs"
required-features = ["security"]

[[example]]
name = "security_nas_eps"
required-features = ["security"]

[[example]]
name = "view_message_nas_5gs"
required-features = ["serde", "std"]

[[example]]
name = "view_message_nas_eps"
required-features = ["serde", "std"]

[package.metadata.docs.rs]
all-features = true
