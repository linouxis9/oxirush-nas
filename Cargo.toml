[package]
name = "oxirush-nas"
version = "0.5.0"
edition = "2024"
description = "5GS and EPS NAS message encoder/decoder per 3GPP TS 24.501 and TS 24.301"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-nas"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "4g", "nas", "3gpp", "codec"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"

[features]
default = []
security = ["dep:oxirush-security", "dep:zeroize"]
serde = ["dep:serde"]

[dependencies]
bytes = "1.5"
thiserror = "2.0.1"
hex = "0.4"
paste = "1"
base64 = "0.22.1"
unicode-normalization = "0.1"
idna = "1"

# Optional: NAS security envelope (integrity + ciphering)
oxirush-security = { version = "0.2.1", optional = true }
zeroize = { version = "1.5", optional = true }

# Optional: JSON serialization
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "security_nas_5gs"
required-features = ["security"]

[[example]]
name = "security_nas_eps"
required-features = ["security"]
